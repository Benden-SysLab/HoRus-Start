---
# Persistent Storage Layout using /dev/disk/by-id/
# Whole disk allocation on NAS storage node (horus-pmx-node03)
storage_layout:
  horus-pmx-node01:
    os_disk_by_id: "/dev/disk/by-id/ata-KINGSTON_SA400S37240G_50026B7682D12345"
    storages: []

  horus-pmx-node02:
    os_disk_by_id: "/dev/disk/by-id/ata-Crucial_CT120BX500SSD1_1948E2221234"
    storages: []

  horus-pmx-node03:
    os_disk_by_id: "/dev/disk/by-id/ata-SanDisk_SDSSDA120G_181156801234"
    storages:
      - name: storage
        disk_model: "WDC WD20EFRX-68EUZN0"
        serial: "WD-WCC4M0EYLS9K"
        by_id: "/dev/disk/by-id/ata-WDC_WD20EFRX-68EUZN0_WD-WCC4M0EYLS9K"
        filesystem: ext4
        mount: /mnt/pve/storage
        purpose: "Proxmox shared storage volume"
        pve_content: ["images", "rootdir"]
        shared: true
        nodes: ["horus-pmx-node01", "horus-pmx-node02", "horus-pmx-node03", "horus-pmx-node04"]

      - name: storage-media
        disk_model: "Seagate ST3000DM007"
        serial: "ZFN1Q0C3"
        by_id: "/dev/disk/by-id/ata-ST3000DM007-1WY10G_ZFN1Q0C3"
        filesystem: ext4
        mount: /mnt/pve/storage-media
        purpose: "Media library archive"
        pve_content: ["images", "rootdir"]
        shared: true
        nodes: ["horus-pmx-node01", "horus-pmx-node02"]

      - name: storage-work
        disk_model: "Seagate ST1000DM003"
        serial: "Z1D1MF6H"
        by_id: "/dev/disk/by-id/ata-ST1000DM003-1CH162_Z1D1MF6H"
        filesystem: ext4
        mount: /mnt/pve/storage-work
        purpose: "General work projects and build cache"
        pve_content: ["images", "rootdir"]
        shared: true
        nodes: ["horus-pmx-node01", "horus-pmx-node02", "horus-pmx-node03", "horus-pmx-node04"]

      - name: storage-infra
        disk_model: "Toshiba MQ01ABD100"
        serial: "X3ONTPEAT"
        by_id: "/dev/disk/by-id/ata-TOSHIBA_MQ01ABD100_X3ONTPEAT"
        filesystem: ext4
        mount: /mnt/pve/storage-infra
        purpose: "Infrastructure Repository (ISOs, Cloud Images, Drivers, Golden Templates, Backups, Snippets)"
        pve_content: ["iso", "vztmpl", "images", "rootdir", "backup", "snippets"]
        shared: true
        nodes: ["horus-pmx-node01", "horus-pmx-node02", "horus-pmx-node03", "horus-pmx-node04"]

  horus-pmx-node04:
    os_disk_by_id: "/dev/disk/by-id/ata-KINGSTON_SA400S37120G_50026B7682D99999"
    storages: []
