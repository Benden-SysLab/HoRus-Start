---
# ==============================================================================
# HoRus-Start Stage 0: Bootstrap Connectivity Playbook
# Goal: Interactive Wizard, Secrets & SSH Key Deployment, Passwordless Verification
# ==============================================================================

- name: "Stage 0.0 & 0.3 | Local Discovery Wizard & Infrastructure SSH Key Generation"
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - "../roles/bootstrap_connectivity/defaults/main.yml"
  tasks:
    - name: "Include Stage 0.0 Wizard Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/00_wizard.yml"

    - name: "Include Stage 0.3 SSH Identity Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/03_ssh_identity.yml"

- name: "Stage 0.1 - 0.5 | Proxmox Nodes Bootstrap & SSH Key Deployment"
  hosts: proxmox_nodes
  gather_facts: false
  become: false
  vars_files:
    - "../roles/bootstrap_connectivity/defaults/main.yml"
  tasks:
    - name: "0.0.X | Load Node Credentials & Management Network Config"
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../credentials/proxmox_credentials.yml"
        - "{{ playbook_dir }}/../config/network.yml"

    - name: "0.0.X | Bind SSH Login User, Password & IP to Runtime Connection Vars"
      ansible.builtin.set_fact:
        ansible_user: "{{ (node_credentials | default({})).get(inventory_hostname, {}).get('username') | default((nodes | default({})).get(inventory_hostname, {}).get('username'), true) | default('root', true) }}"
        ansible_password: "{{ (node_credentials | default({})).get(inventory_hostname, {}).get('password') | default((nodes | default({})).get(inventory_hostname, {}).get('password'), true) | default('', true) }}"
        ansible_host: "{{ (node_network | default({})).get(inventory_hostname, {}).get('management_ip') | default((nodes | default({})).get(inventory_hostname, {}).get('management_ip'), true) | default(ansible_host, true) }}"

    - name: "Include Stage 0.1 Discovery Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/01_discovery.yml"

    - name: "Include Stage 0.2 Authentication Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/02_authentication.yml"

    - name: "Include Stage 0.4 SSH Deployment Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/04_ssh_deployment.yml"

    - name: "Include Stage 0.5 Verification Tasks"
      ansible.builtin.include_tasks: "../roles/bootstrap_connectivity/tasks/05_verification.yml"

