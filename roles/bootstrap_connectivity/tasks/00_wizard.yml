---
# 0.0 Interactive Address, Node Count, and Credentials Discovery Wizard
- name: "0.0.1 [Wizard] Check if cluster configuration exists"
  ansible.builtin.stat:
    path: "{{ cluster_config_file }}"
  delegate_to: localhost
  register: cluster_config_file_stat
  run_once: true

- name: "0.0.2 [Wizard] Ensure config directory exists"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  loop:
    - "{{ cluster_config_file | dirname }}"
  run_once: true

- name: "0.0.3 [Wizard] Load existing cluster and network configuration if present"
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - "{{ cluster_config_file }}"
    - "{{ network_config_file }}"
  when: cluster_config_file_stat.stat.exists
  run_once: true
  ignore_errors: true

- name: "0.0.4 [Wizard] Determine if interactive configuration input is required"
  ansible.builtin.set_fact:
    wizard_needed: >-
      {{
        (not (cluster_config_file_stat.stat.exists | default(false))) or
        (
          ((node_credentials | default({})).get('horus-pmx-node01', {}).get('password') | default('', true) == '') and
          ((nodes | default({})).get('horus-pmx-node01', {}).get('password') | default('', true) == '')
        )
      }}
  run_once: true

- name: "0.0.5 [Wizard] Notify existing configuration loaded"
  ansible.builtin.debug:
    msg: "✔ Existing cluster and network configuration loaded. Skipping interactive wizard."
  when: not wizard_needed
  run_once: true

# --- Interactive Prompts (Run when wizard_needed is true) ---

- name: "0.0.6 [Wizard] Prompt Cluster Name"
  ansible.builtin.pause:
    prompt: "Enter Proxmox VE Cluster Name [Default: HoRus-SysLab]: "
  register: wizard_cluster_name_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.7 [Wizard] Prompt Number of Proxmox Nodes"
  ansible.builtin.pause:
    prompt: "Enter Number of Proxmox VE Nodes [Default: 4]: "
  register: wizard_node_count_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.8 [Wizard] Prompt Default SSH Root Username"
  ansible.builtin.pause:
    prompt: "Enter Default SSH Username for Proxmox Nodes [Default: root]: "
  register: wizard_username_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.9 [Wizard] Prompt Node 01 SSH Root Password"
  ansible.builtin.pause:
    prompt: "Enter SSH Root Password for horus-pmx-node01: "
    echo: false
  register: wizard_password_node01_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.9b [Wizard] Prompt Node 02 SSH Root Password"
  ansible.builtin.pause:
    prompt: "Enter SSH Root Password for horus-pmx-node02: "
    echo: false
  register: wizard_password_node02_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.9c [Wizard] Prompt Node 03 SSH Root Password"
  ansible.builtin.pause:
    prompt: "Enter SSH Root Password for horus-pmx-node03: "
    echo: false
  register: wizard_password_node03_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.9d [Wizard] Prompt Node 04 SSH Root Password"
  ansible.builtin.pause:
    prompt: "Enter SSH Root Password for horus-pmx-node04: "
    echo: false
  register: wizard_password_node04_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.10 [Wizard] Prompt Node 01 Management IP"
  ansible.builtin.pause:
    prompt: "Enter horus-pmx-node01 Management IP [Default: 10.255.0.7]: "
  register: wizard_node01_ip_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.11 [Wizard] Prompt Node 02 Management IP"
  ansible.builtin.pause:
    prompt: "Enter horus-pmx-node02 Management IP [Default: 10.255.0.8]: "
  register: wizard_node02_ip_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.12 [Wizard] Prompt Node 03 Management IP"
  ansible.builtin.pause:
    prompt: "Enter horus-pmx-node03 Management IP [Default: 10.255.0.9]: "
  register: wizard_node03_ip_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.13 [Wizard] Prompt Node 04 Management IP"
  ansible.builtin.pause:
    prompt: "Enter horus-pmx-node04 Management IP [Default: 10.255.0.10]: "
  register: wizard_node04_ip_input
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.14 [Wizard] Keep bootstrap password in memory for this run only"
  ansible.builtin.set_fact:
    node_credentials:
      horus-pmx-node01:
        username: "{{ wizard_username_input.user_input | default('root') if wizard_username_input is defined and wizard_username_input.user_input != '' else 'root' }}"
        password: "{{ wizard_password_node01_input.user_input | default('') if wizard_password_node01_input is defined else '' }}"
      horus-pmx-node02:
        username: "{{ wizard_username_input.user_input | default('root') if wizard_username_input is defined and wizard_username_input.user_input != '' else 'root' }}"
        password: "{{ wizard_password_node02_input.user_input | default('') if wizard_password_node02_input is defined else '' }}"
      horus-pmx-node03:
        username: "{{ wizard_username_input.user_input | default('root') if wizard_username_input is defined and wizard_username_input.user_input != '' else 'root' }}"
        password: "{{ wizard_password_node03_input.user_input | default('') if wizard_password_node03_input is defined else '' }}"
      horus-pmx-node04:
        username: "{{ wizard_username_input.user_input | default('root') if wizard_username_input is defined and wizard_username_input.user_input != '' else 'root' }}"
        password: "{{ wizard_password_node04_input.user_input | default('') if wizard_password_node04_input is defined else '' }}"
  no_log: true
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.15 [Wizard] Save long-term topology & roles to config/cluster.yml"
  ansible.builtin.copy:
    dest: "{{ cluster_config_file }}"
    mode: '0644'
    content: |
      # Long-term Proxmox Infrastructure Configuration (config/ - SOURCE OF TRUTH)
      cluster:
        name: "{{ wizard_cluster_name_input.user_input | default('HoRus-SysLab') if wizard_cluster_name_input is defined and wizard_cluster_name_input.user_input != '' else 'HoRus-SysLab' }}"

      nodes:
        - name: horus-pmx-node01
          role:
            - master
        - name: horus-pmx-node02
          role:
            - worker
        - name: horus-pmx-node03
          role:
            - worker
        - name: horus-pmx-node04
          role:
            - worker
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.16 [Wizard] Save network IP management plan to config/network.yml"
  ansible.builtin.copy:
    dest: "{{ network_config_file }}"
    mode: '0644'
    content: |
      # Management Network Topology (config/ - NETWORK PLAN)
      nodes:
        horus-pmx-node01:
          management_ip: "{{ wizard_node01_ip_input.user_input | default('10.255.0.7') if wizard_node01_ip_input is defined and wizard_node01_ip_input.user_input != '' else '10.255.0.7' }}"
        horus-pmx-node02:
          management_ip: "{{ wizard_node02_ip_input.user_input | default('10.255.0.8') if wizard_node02_ip_input is defined and wizard_node02_ip_input.user_input != '' else '10.255.0.8' }}"
        horus-pmx-node03:
          management_ip: "{{ wizard_node03_ip_input.user_input | default('10.255.0.9') if wizard_node03_ip_input is defined and wizard_node03_ip_input.user_input != '' else '10.255.0.9' }}"
        horus-pmx-node04:
          management_ip: "{{ wizard_node04_ip_input.user_input | default('10.255.0.10') if wizard_node04_ip_input is defined and wizard_node04_ip_input.user_input != '' else '10.255.0.10' }}"
  delegate_to: localhost
  run_once: true
  when: wizard_needed

- name: "0.0.16 [Wizard] Reload secrets and configuration into runtime variables"
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - "{{ cluster_config_file }}"
    - "{{ network_config_file }}"
  run_once: true

