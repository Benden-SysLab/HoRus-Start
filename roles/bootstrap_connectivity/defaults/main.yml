---
# Config Directory Paths (config/ - SOURCE OF TRUTH)
config_dir: "{{ playbook_dir }}/../config"
cluster_config_file: "{{ config_dir }}/cluster.yml"
network_config_file: "{{ config_dir }}/network.yml"

# SSH keys live outside the repository. Set HORUS_SSH_KEY_DIR on the control
# node to the platform-specific path, or use the default ~/.ssh location.
ssh_identity_dir: "{{ lookup('env', 'HORUS_SSH_KEY_DIR') | default((lookup('env', 'USERPROFILE') if lookup('env', 'USERPROFILE') else lookup('env', 'HOME')) ~ '/.ssh/horus/horus-pmx-node', true) }}"
ssh_identity_filename: "{{ lookup('env', 'HORUS_SSH_KEY_NAME') | default('horus-pmx-cluster', true) }}"
ssh_identity_manifest: "{{ ssh_identity_dir }}/manifest.yml"
ssh_identity_type: "ed25519"
ssh_identity_comment: "horus-pmx-cluster@horus"
ansible_ssh_private_key_file: "{{ ssh_identity_dir }}/{{ ssh_identity_filename }}"

inventory_file: "{{ playbook_dir }}/../inventory/hosts.yml"

discovery_check_icmp: true
discovery_ssh_port: 22
discovery_timeout: 5

ssh_deploy_user: "root"
ssh_deploy_ssh_dir: "/root/.ssh"

# Runtime Generated Data Paths (runtime/ - GENERATED DATA)
runtime_dir: "{{ playbook_dir }}/../runtime"
reports_dir: "{{ runtime_dir }}/reports"
cache_dir: "{{ runtime_dir }}/cache"
facts_dir: "{{ runtime_dir }}/facts"
stage0_report_file: "{{ reports_dir }}/stage0.json"
