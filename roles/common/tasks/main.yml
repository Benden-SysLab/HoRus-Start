---
# Role: common
# Sets base hostname, timezone, locale, NTP, and installs core management tools.

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure system timezone to UTC
  community.general.timezone:
    name: "{{ system_timezone | default('UTC') }}"

- name: Ensure en_US.UTF-8 locale is generated
  community.general.locale_gen:
    name: "{{ system_locale | default('en_US.UTF-8') }}"
    state: present

- name: Install systemd-timesyncd package for NTP synchronization
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
    update_cache: true
    cache_valid_time: 3600
  ignore_errors: true

- name: Ensure systemd-timesyncd NTP service is active and enabled
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
  ignore_errors: true

- name: Install required core utilities on Proxmox node
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
