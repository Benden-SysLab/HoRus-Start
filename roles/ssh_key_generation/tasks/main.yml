---
# Role: ssh_key_generation
# Generates infrastructure-wide ed25519 SSH keypair in credentials/ssh/ if missing.

- name: Check if private infrastructure SSH key exists locally
  ansible.builtin.stat:
    path: "{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: ssh_key_stat

- name: Create local credentials/ssh directory if missing
  ansible.builtin.file:
    path: "{{ horus_ssh_key_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate ed25519 SSH keypair for HoRus Infrastructure if absent
  ansible.builtin.command:
    cmd: "ssh-keygen -t {{ horus_ssh_key_type }} -f '{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}' -N '' -C 'terraform-srv@horus-infrastructure'"
    creates: "{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: not ssh_key_stat.stat.exists

- name: Ensure strict permissions on SSH private key (0600)
  ansible.builtin.file:
    path: "{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure strict permissions on SSH public key (0644)
  ansible.builtin.file:
    path: "{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}.pub"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true

- name: Read generated SSH public key content
  ansible.builtin.slurp:
    src: "{{ horus_ssh_key_dir }}/{{ horus_ssh_key_name }}.pub"
  delegate_to: localhost
  become: false
  run_once: true
  register: horus_public_key_b64

- name: Set fact for horus_infra_public_key
  ansible.builtin.set_fact:
    horus_infra_public_key: "{{ horus_public_key_b64.content | b64decode | trim }}"
  run_once: true

- name: Display Public Infrastructure SSH Key Banner
  ansible.builtin.debug:
    msg:
      - "===================================================="
      - "Infrastructure Public SSH Key"
      - "===================================================="
      - "{{ horus_infra_public_key }}"
      - "===================================================="
      - "Add this public key into KeePass if desired."
      - "Private key location:"
      - "credentials/ssh/id_ed25519_horus_infra"
      - "===================================================="
  delegate_to: localhost
  become: false
  run_once: true

- name: Verify .gitignore contains credentials protection rule
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../.gitignore"
    line: "credentials/ssh/id_ed25519_horus_infra"
    state: present
  delegate_to: localhost
  become: false
  run_once: true

