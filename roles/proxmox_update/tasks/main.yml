---
# Role: proxmox_update
# Performs system package upgrades and handles host reboot if required.

- name: Update apt repository cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade all system packages (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Check if system reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot Proxmox node if reboot is required
  ansible.builtin.reboot:
    msg: "Rebooting Proxmox VE node after system updates (HoRus-Start Day-0)"
    connect_timeout: 10
    reboot_timeout: "{{ proxmox_reboot_timeout | default(300) }}"
    pre_reboot_delay: 2
    post_reboot_delay: 15
    test_command: uptime
  when: reboot_required_file.stat.exists and (proxmox_auto_reboot_if_needed | default(true))

- name: Verify SSH connectivity and Proxmox node responsiveness after update
  ansible.builtin.wait_for_connection:
    timeout: 60
