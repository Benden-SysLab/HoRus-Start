---
# 1.2 System Update Tasks
- name: "1.2.1 [System Update] Update apt package cache"
  ansible.builtin.apt:
    update_cache: true

- name: "1.2.2 [System Update] Perform full distribution upgrade (dist-upgrade)"
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: "1.2.3 [System Update] Check if system reboot is required post-upgrade"
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_flag

- name: "1.2.4 [System Update] Display reboot status indicator"
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} reboot required: {{ reboot_flag.stat.exists }}"

- name: "1.2.5 [System Update] Reboot node if kernel update requires reboot"
  ansible.builtin.reboot:
    msg: "Rebooting {{ inventory_hostname }} following Stage 1 system dist-upgrade"
    connect_timeout: 10
    reboot_timeout: 300
    pre_reboot_delay: 2
    post_reboot_delay: 15
    test_command: uptime
  when: reboot_flag.stat.exists and (allow_stage1_reboot | default(true))

- name: "1.2.6 [System Update] Confirm SSH connection active after update"
  ansible.builtin.wait_for_connection:
    timeout: 60
