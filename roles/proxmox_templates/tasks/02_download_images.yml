---
# ==============================================================================
# HoRus-Start Stage 5.3: Asset Catalog Publisher - Phase 5.3.2 Downloader & Publisher
# File: roles/proxmox_templates/tasks/02_download_images.yml
# ==============================================================================

- name: "5.3.2.0 [Downloader] Purge corrupted Cloud Images before download"
  ansible.builtin.file:
    path: "{{ item.value.path }}"
    state: absent
  loop: "{{ cloud_images_discovery | dict2items }}"
  when: item.value.status == 'CORRUPTED'
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'download', 'validation']

- name: "5.3.2.0b [Downloader] Force stop active background downloader if requested"
  ansible.builtin.shell: |
    if [ -f {{ factory_base_dir }}/runtime/logs/downloader.pid ]; then
      PID=$(cat {{ factory_base_dir }}/runtime/logs/downloader.pid)
      kill -9 $PID 2>/dev/null || true
      rm -f {{ factory_base_dir }}/runtime/logs/downloader.pid
    fi
    pkill -9 -f "curl.*iso" 2>/dev/null || true
    pkill -9 -f "curl.*qcow2" 2>/dev/null || true
    rm -f {{ factory_base_dir }}/assets/iso/*.tmp
    rm -f {{ factory_base_dir }}/assets/drivers/*.tmp
    rm -f {{ factory_base_dir }}/assets/cloud-images/*.tmp
  when: force_restart_downloader | default(false)
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  failed_when: false
  tags: ['stage5', 'download']

- name: "5.3.2.1 [Downloader] Check existing status of all ISO & Driver assets in template/iso"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/template/iso/{{ item.name }}"
  loop:
    - { name: "{{ iso_images.debian.netinst.name }}", url: "{{ iso_images.debian.netinst.url }}", key: "debian_netinst" }
    - { name: "{{ iso_images.debian.dvd.name }}", url: "{{ iso_images.debian.dvd.url }}", key: "debian_dvd" }
    - { name: "{{ drivers.virtio.windows.name }}", url: "{{ drivers.virtio.windows.url }}", key: "virtio_win" }
    - { name: "{{ iso_images.windows.win7.name }}", url: "{{ iso_images.windows.win7.url }}", key: "win7" }
    - { name: "{{ iso_images.windows.winxp.name }}", url: "{{ iso_images.windows.winxp.url }}", key: "winxp" }
  register: iso_asset_stats
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'download', 'validation']

- name: "5.3.2.2 [Downloader] Determine list of missing ISO & Driver assets"
  ansible.builtin.set_fact:
    missing_iso_assets: "{{ iso_asset_stats.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'download']

- name: "5.3.2.3 [Downloader] Check if background downloader process is active"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/runtime/logs/downloader.pid"
  register: downloader_pid_stat
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'download']

- name: "5.3.2.4 [Downloader] Verify background downloader process status via PID"
  ansible.builtin.command: "kill -0 $(cat {{ factory_base_dir }}/runtime/logs/downloader.pid)"
  register: downloader_proc_check
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  failed_when: false
  changed_when: false
  when: downloader_pid_stat.stat.exists | default(false)
  tags: ['stage5', 'download']

- name: "5.3.2.5 [Downloader] Launch background downloader for missing Cloud, ISO, & Driver assets"
  ansible.builtin.shell: |
    exec > {{ factory_base_dir }}/runtime/logs/downloader.log 2>&1
    echo "$$" > {{ factory_base_dir }}/runtime/logs/downloader.pid
    trap 'rm -f {{ factory_base_dir }}/runtime/logs/downloader.pid' EXIT

    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting Stage 5.3 Asset Catalog background downloader..."

    # 1. Download missing Cloud Images into assets/cloud-images/
    {% for os_key in missing_cloud_images %}
    {% set img = cloud_images_discovery[os_key] %}
    if [ -s "{{ img.path }}" ]; then
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SKIP: Cloud Image {{ img.name }} already present."
    else
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] DOWNLOADING Cloud Image {{ img.name }}..."
      if curl -C - -fSL --connect-timeout 30 --retry 5 -o "{{ img.path }}.tmp" "{{ img.url }}"; then
        mv "{{ img.path }}.tmp" "{{ img.path }}"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SUCCESS: Cloud Image {{ img.name }}"
      else
        rm -f "{{ img.path }}.tmp"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: Failed Cloud Image {{ img.name }}"
      fi
    fi
    {% endfor %}

    # 2. Download missing ISOs & Drivers into assets/ cache then publish to template/iso/
    {% for iso in missing_iso_assets %}
    {% if iso.url != "" %}
    ASSET_DEST="{{ factory_base_dir }}/assets/iso/{{ iso.name }}"
    PVE_DEST="{{ factory_base_dir }}/template/iso/{{ iso.name }}"
    if [ "{{ iso.key }}" = "virtio_win" ]; then
      ASSET_DEST="{{ factory_base_dir }}/assets/drivers/{{ iso.name }}"
    fi

    if [ -s "${PVE_DEST}" ]; then
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SKIP: ISO {{ iso.name }} already exists in ${PVE_DEST}"
    elif [ -s "${ASSET_DEST}" ]; then
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] PUBLISHING: Cached {{ iso.name }} from ${ASSET_DEST} -> ${PVE_DEST}"
      cp "${ASSET_DEST}" "${PVE_DEST}"
    else
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] DOWNLOADING ISO {{ iso.name }} from {{ iso.url }}..."
      if curl -C - -fSL --connect-timeout 30 --retry 5 -o "${ASSET_DEST}.tmp" "{{ iso.url }}"; then
        mv "${ASSET_DEST}.tmp" "${ASSET_DEST}"
        cp "${ASSET_DEST}" "${PVE_DEST}"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SUCCESS: Published ISO {{ iso.name }} to ${PVE_DEST}"
      else
        rm -f "${ASSET_DEST}.tmp"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: Failed ISO {{ iso.name }}"
      fi
    fi
    {% endif %}
    {% endfor %}

    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] All Stage 5.3 background downloads completed successfully."
  args:
    executable: /bin/bash
  async: 7200
  poll: 0
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  when:
    - (missing_cloud_images | length > 0) or (missing_iso_assets | length > 0)
    - downloader_proc_check.rc | default(1) != 0
  register: background_downloader_job
  tags: ['stage5', 'download']

- name: "5.3.2.6 [Downloader] Set background download status facts"
  ansible.builtin.set_fact:
    stage5_download_in_progress: true
  when: (missing_cloud_images | length > 0) or (missing_iso_assets | length > 0)
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'download']

- name: "5.3.2.7 [Publish] Copy available manual assets to template/iso if present"
  ansible.builtin.shell: |
    for file in {{ factory_base_dir }}/assets/manual/*.iso {{ factory_base_dir }}/assets/manual/*.bin {{ factory_base_dir }}/assets/iso/*.iso; do
      if [ -s "$file" ]; then
        filename=$(basename "$file")
        pve_target="{{ factory_base_dir }}/template/iso/$filename"
        if [ ! -s "$pve_target" ]; then
          cp "$file" "$pve_target"
          echo "Published manual asset: $filename"
        fi
      fi
    done
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  failed_when: false
  tags: ['stage5', 'publish']

- name: "5.3.2.8 [Validation] Validate integrity of PRESENT qcow2 Cloud Images via qemu-img info"
  ansible.builtin.command: "qemu-img info {{ item.value.path }}"
  loop: "{{ cloud_images_discovery | dict2items }}"
  register: qemu_img_checks
  when:
    - missing_cloud_images | length == 0
    - missing_iso_assets | length == 0
    - item.value.status == 'PRESENT'
    - item.value.name.endswith('.qcow2') or item.value.name.endswith('.img')
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  failed_when: false
  changed_when: false
  tags: ['stage5', 'validation']

- name: "5.3.2.9 [Validation] Remove damaged Cloud Images failing qemu-img validation"
  ansible.builtin.file:
    path: "{{ item.item.value.path }}"
    state: absent
  loop: "{{ qemu_img_checks.results | default([]) }}"
  when:
    - missing_cloud_images | length == 0
    - missing_iso_assets | length == 0
    - item.rc | default(0) != 0
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'validation']

# ------------------------------------------------------------------------------
# Reports Generation for Stage 5.3 Asset Catalog Publisher
# ------------------------------------------------------------------------------
- name: "5.3.2.10 [Reporting] Ensure local runtime/reports directory exists"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../runtime/reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'reporting']

- name: "5.3.2.11 [Reporting] Generate Asset Catalog Report (runtime/reports/asset_catalog.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/asset_catalog.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-asset'),
      'producer': 'ansible_stage5_asset_catalog_publisher',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'asset_catalog',
      'status': ('IN_PROGRESS' if (stage5_download_in_progress | default(false)) else 'ASSET_CATALOG_READY'),
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': (ansible_date_time.iso8601 if not (stage5_download_in_progress | default(false)) else None)
      },
      'dry_run': false,
      'health': {
        'state': ('warning' if (stage5_download_in_progress | default(false)) else 'healthy'),
        'warnings': (1 if (stage5_download_in_progress | default(false)) else 0),
        'errors': 0,
        'status': ('IN_PROGRESS' if (stage5_download_in_progress | default(false)) else 'ASSET_CATALOG_READY'),
        'builder_node': master_builder_node,
        'storage_name': factory_storage_name,
        'cloud_images_count': supported_os | length,
        'missing_cloud_images': missing_cloud_images | default([]),
        'missing_iso_assets_count': missing_iso_assets | default([]) | length
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'cloud_images': cloud_images_discovery | default({}),
          'iso_catalog': iso_catalog_discovery | default({}),
          'driver_catalog': driver_catalog_discovery | default({}),
          'manual_assets': manual_assets_discovery | default({})
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.3.2.12 [Reporting] Generate Machine-Readable Stage 5 JSON Report (runtime/reports/stage5.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/stage5.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-asset'),
      'producer': 'ansible_stage5_asset_catalog_publisher',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'asset_catalog',
      'status': ('IN_PROGRESS' if (stage5_download_in_progress | default(false)) else 'ASSET_CATALOG_READY'),
      'completed': ['discovery', 'planning', 'asset_catalog'],
      'pending': ['reporting'],
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': None
      },
      'dry_run': false,
      'health': {
        'state': ('warning' if (stage5_download_in_progress | default(false)) else 'healthy'),
        'warnings': (1 if (stage5_download_in_progress | default(false)) else 0),
        'errors': 0,
        'status': ('WAITING_IMAGE_DOWNLOAD' if (stage5_download_in_progress | default(false)) else 'ASSET_CATALOG_READY'),
        'download_in_progress': stage5_download_in_progress | default(false),
        'master_builder_node': master_builder_node,
        'factory_storage': factory_storage_name,
        'missing_images_count': missing_cloud_images | default([]) | length,
        'missing_iso_count': missing_iso_assets | default([]) | length
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'storage': factory_storage_name,
          'cloud_images': cloud_images_discovery | default({}),
          'iso_catalog': iso_catalog_discovery | default({}),
          'driver_catalog': driver_catalog_discovery | default({})
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.3.2.13 [Reporting] Mirror Stage 5 Reports to Builder Node Runtime Directory"
  ansible.builtin.copy:
    dest: "{{ factory_base_dir }}/runtime/reports/{{ item }}"
    src: "{{ playbook_dir }}/../runtime/reports/{{ item }}"
    mode: '0644'
  loop:
    - "asset_catalog.json"
    - "stage5.json"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  changed_when: false
  tags: ['stage5', 'reporting']


