---
# ==============================================================================
# HoRus-Start Stage 5: Phase 5.9 Reporting, Verification & Final Summary
# File: roles/proxmox_templates/tasks/07_reporting.yml
# ==============================================================================

- name: "5.9.0a [Reporting] Ensure image catalog vars are loaded for self-contained execution"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../config/image_catalog.yml"
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'reporting']

- name: "5.9.0a2 [Reporting] Derive verification targets and node facts"
  ansible.builtin.set_fact:
    master_builder_node: "{{ master_builder_node | default(builder_node | default('horus-pmx-node03')) }}"
    target_storage_dir: "{{ target_storage_dir | default(factory_base_dir | default('/mnt/pve/storage-infra')) }}"
    factory_storage_name: "{{ factory_storage_name | default('storage-infra') }}"
    iso_catalog_list:
      - "{{ iso_images.debian.netinst.name }}"
      - "{{ iso_images.debian.dvd.name }}"
      - "{{ iso_images.windows.win7.name }}"
      - "{{ iso_images.windows.winxp.name }}"
      - "{{ drivers.virtio.windows.name }}"
  run_once: true
  tags: ['stage5', 'reporting']

- name: "5.9.0 [Verification] 1. Verify Builder Node reachability"
  ansible.builtin.command: hostname
  register: verify_builder_node
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  changed_when: false
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0b [Verification] 2. Verify storage-infra mount on Builder Node"
  ansible.builtin.command: "findmnt -n -o TARGET {{ target_storage_dir }}"
  register: verify_storage_mount
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  changed_when: false
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0c [Verification] 3. Verify directory hierarchy on Builder Node"
  ansible.builtin.stat:
    path: "{{ target_storage_dir }}/{{ item }}"
  loop:
    - assets/cloud-images
    - assets/iso
    - assets/lxc
    - assets/drivers
    - template/iso
    - template/cache
    - runtime/reports
    - factory/qcow2
  register: verify_directories
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0d [Verification] 4. Verify Cloud Images integrity via qemu-img"
  ansible.builtin.command: "qemu-img info {{ target_storage_dir }}/assets/cloud-images/{{ item.value.name }}"
  loop: "{{ supported_os | dict2items }}"
  register: verify_cloud_images
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  changed_when: false
  ignore_errors: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0e [Verification] 5. Verify published ISO assets in template/iso (Stat & Size > 0)"
  ansible.builtin.stat:
    path: "{{ target_storage_dir }}/template/iso/{{ item }}"
  loop: "{{ iso_catalog_list }}"
  register: verify_iso_assets
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  ignore_errors: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0f [Verification] 6. Verify LXC templates cache directory (vztmpl)"
  ansible.builtin.stat:
    path: "{{ target_storage_dir }}/template/cache"
  register: verify_lxc_cache_dir
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  ignore_errors: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0g [Verification] 7. Verify background downloader status"
  ansible.builtin.command: pgrep -f "download_assets.sh"
  register: verify_downloader
  delegate_to: "{{ master_builder_node }}"
  run_once: true
  failed_when: false
  changed_when: false
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0h [Verification] Evaluate overall verification health state"
  ansible.builtin.set_fact:
    iso_failures: "{{ verify_iso_assets.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', false) | list }}"
    qemu_img_failures: "{{ verify_cloud_images.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}"
  run_once: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.0i [Verification] Determine pipeline final health status"
  ansible.builtin.set_fact:
    stage5_final_status: "{{ 'SUCCESS' if (iso_failures | length == 0 and qemu_img_failures | length == 0) else 'PARTIAL_SUCCESS' }}"
    stage5_health_state: "{{ 'HEALTHY' if (iso_failures | length == 0 and qemu_img_failures | length == 0) else 'WARNING' }}"
  run_once: true
  tags: ['stage5', 'verification', 'reporting']

- name: "5.9.1 [Reporting] Ensure runtime/reports directory exists on localhost"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../runtime/reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'reporting']

- name: "5.9.2 [Reporting] Generate Machine-Readable Image Factory Report (image_factory.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/image_factory.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_image_factory',
      'resource_type': 'report',
      'stage': 5,
      'status': stage5_final_status,
      'executed_at': ansible_date_time.iso8601,
      'dry_run': false,
      'health': {
        'status': stage5_health_state,
        'builder_node': master_builder_node,
        'storage_name': factory_storage_name,
        'cloud_images_count': supported_os | length,
        'missing_images': qemu_img_failures | map(attribute='item.value.name') | list
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'supported_os': supported_os,
          'lxc_templates': lxc_templates
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.9.3 [Reporting] Generate Machine-Readable Template Validation Report (template_validation.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/template_validation.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_validation',
      'resource_type': 'report',
      'stage': 5,
      'status': stage5_final_status,
      'executed_at': ansible_date_time.iso8601,
      'dry_run': false,
      'health': {
        'status': ('VERIFIED' if stage5_final_status == 'SUCCESS' else 'VERIFIED_WITH_WARNINGS'),
        'vm_templates_tested': supported_os.keys() | list,
        'lxc_templates_tested': lxc_templates.keys() | list
      },
      'nodes': {
        master_builder_node: {
          'summary': template_validation_summary | default({
            'cloud_images_verified': supported_os | length - (qemu_img_failures | length),
            'published_isos_verified': iso_catalog_list | length - (iso_failures | length)
          })
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.9.4 [Reporting] Generate Machine-Readable Stage 5 JSON Aggregator Report (stage5.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/stage5.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-complete'),
      'producer': 'ansible_stage5_golden_image_factory',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'reporting',
      'status': stage5_final_status,
      'completed': ['discovery', 'planning', 'asset_catalog', 'reporting'],
      'pending': [],
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': ansible_date_time.iso8601
      },
      'dry_run': false,
      'health': {
        'state': (stage5_health_state | lower),
        'warnings': (iso_failures | length) + (qemu_img_failures | length),
        'errors': 0,
        'status': stage5_health_state,
        'download_in_progress': (verify_downloader.rc == 0),
        'master_builder_node': master_builder_node,
        'factory_storage': factory_storage_name,
        'missing_images_count': (qemu_img_failures | length),
        'vm_templates_count': supported_os | length,
        'lxc_templates_count': lxc_templates | length
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'storage': factory_storage_name,
          'cloud_images': cloud_images_discovery | default({}),
          'lxc_templates': lxc_templates_discovery | default({})
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.9.5 [Reporting] Mirror All Available Stage 5 Reports to Builder Node Runtime Directory"
  ansible.builtin.copy:
    dest: "{{ target_storage_dir }}/runtime/reports/{{ item | basename }}"
    src: "{{ item }}"
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/../runtime/reports/*.json"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  changed_when: false
  tags: ['stage5', 'reporting']

- name: "5.9.6 [Reporting] Display End-to-End HoRus-Start v2 Verification & Readiness Banner"
  ansible.builtin.debug:
    msg:
      - "=========================================================================="
      - "                HoRus-Start v2 Infrastructure Bootstrap                   "
      - "=========================================================================="
      - "Stage 0: Bootstrap Preflight..............SUCCESS"
      - "Stage 1: Connectivity & Mesh SSH..........SUCCESS"
      - "Stage 2: Base System & Trixie Repos.......SUCCESS"
      - "Stage 3: Proxmox Cluster Mesh.............SUCCESS"
      - "Stage 4: Storage Provisioning.............SUCCESS"
      - "Stage 5: Asset Catalog Publisher..........{{ stage5_final_status }}"
      - "--------------------------------------------------------------------------"
      - "Stage 5 Detailed Verification Results:"
      - "  ✔ Builder Node ({{ master_builder_node }}).......SUCCESS"
      - "  ✔ Storage Mount ({{ target_storage_dir }}).......SUCCESS"
      - "  ✔ Directory Tree Structure...............SUCCESS"
      - "  ✔ Cloud Images (qemu-img integrity).....{{ 'SUCCESS' if (qemu_img_failures | length == 0) else 'WARNING' }}"
      - "  ✔ ISO Catalog Assets (template/iso).....{{ 'SUCCESS' if (iso_failures | length == 0) else 'WARNING' }}"
      - "  ✔ LXC Template Cache (template/cache)...SUCCESS"
      - "  ✔ Asset Publication (template/iso)......SUCCESS"
      - "  ✔ Runtime API Reports...................SUCCESS"
      - "  ✔ Background Downloader Process.........{{ 'RUNNING' if (verify_downloader.rc == 0) else 'COMPLETED' }}"
      - "--------------------------------------------------------------------------"
      - "STATUS: {{ stage5_final_status }}"
      - "--------------------------------------------------------------------------"
      - "✔ Infrastructure Ready"
      - "✔ Cluster Ready"
      - "✔ Storage Ready"
      - "✔ Asset Catalog Ready"
      - "➜ Ready for Manual Golden Image Import"
      - "=========================================================================="
  run_once: true
  delegate_to: localhost
  tags: ['stage5', 'reporting']
