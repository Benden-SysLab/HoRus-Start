---
# ==============================================================================
# HoRus-Start Stage 5.3: Asset Catalog Publisher - Phase 5.3.1 Discovery
# File: roles/proxmox_templates/tasks/01_discovery.yml
# ==============================================================================

- name: "5.3.1.1 [Discovery] Verify existence of Image Catalog configuration"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config/image_catalog.yml"
  register: image_catalog_stat
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'discovery']

- name: "5.3.1.2 [Discovery] Load Image Catalog configuration"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../config/image_catalog.yml"
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'discovery']

- name: "5.3.1.3 [Discovery] Determine Master Builder Node and storage paths"
  ansible.builtin.set_fact:
    master_builder_node: "{{ builder_node | default('horus-pmx-node03') }}"
    factory_storage_name: "storage-infra"
    factory_base_dir: "/mnt/pve/storage-infra"
    stage5_execution_id: "{{ ansible_date_time.iso8601_basic_short }}-{{ 9999 | random(seed=ansible_date_time.epoch) }}"
    stage5_start_time: "{{ ansible_date_time.iso8601 }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.4 [Discovery] Check existence of storage-infra mount path on builder node"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}"
  register: storage_infra_stat
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.5 [Discovery] Fallback storage path to /var/lib/vz if storage-infra absent"
  ansible.builtin.set_fact:
    factory_storage_name: "local"
    factory_base_dir: "/var/lib/vz"
  when: not storage_infra_stat.stat.exists
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.6 [Discovery] Ensure asset directory hierarchy exists on builder node"
  ansible.builtin.file:
    path: "{{ factory_base_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "assets/cloud-images"
    - "assets/iso"
    - "assets/lxc"
    - "assets/drivers"
    - "assets/manual"
    - "template/iso"
    - "template/cache"
    - "factory/qcow2"
    - "factory/manifests"
    - "runtime/logs"
    - "runtime/discovery"
    - "runtime/reports"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

# ------------------------------------------------------------------------------
# 1. Cloud Images Discovery
# ------------------------------------------------------------------------------
- name: "5.3.1.7 [Discovery] Check status of configured Cloud Images"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/assets/cloud-images/{{ item.value.name }}"
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ supported_os | dict2items }}"
  register: cloud_image_stats
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.8 [Discovery] Classify Cloud Images status (PRESENT, MISSING, CORRUPTED)"
  ansible.builtin.set_fact:
    cloud_images_discovery: "{{ cloud_images_discovery | default({}) | combine({
      item.item.key: {
        'name': item.item.value.name,
        'template_name': item.item.value.template_name,
        'vmid': item.item.value.vmid,
        'url': item.item.value.url,
        'path': factory_base_dir + '/assets/cloud-images/' + item.item.value.name,
        'status': (
          'PRESENT' if (
            item.stat.exists | default(false) and
            (item.stat.size | default(0) > 0) and
            (
              (item.item.value.sha256 | default('') in ['', 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855']) or
              (item.stat.checksum | default('') == item.item.value.sha256 | default(''))
            )
          ) else (
            'CORRUPTED' if (item.stat.exists | default(false) and item.stat.size | default(0) > 0) else 'MISSING'
          )
        ),
        'size_bytes': item.stat.size | default(0),
        'sha256_actual': item.stat.checksum | default(''),
        'sha256_expected': item.item.value.sha256 | default('')
      }
    }) }}"
  loop: "{{ cloud_image_stats.results }}"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.9 [Discovery] Evaluate missing Cloud Images list"
  ansible.builtin.set_fact:
    missing_cloud_images: "{{ cloud_images_discovery | dict2items | selectattr('value.status', 'in', ['MISSING', 'CORRUPTED']) | map(attribute='key') | list }}"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

# ------------------------------------------------------------------------------
# 2. ISO Catalog Discovery
# ------------------------------------------------------------------------------
- name: "5.3.1.10 [Discovery] Check ISO Catalog assets in template/iso and assets/iso"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/template/iso/{{ item.name }}"
  loop:
    - { name: "{{ iso_images.debian.netinst.name }}", url: "{{ iso_images.debian.netinst.url }}", key: "debian_netinst", category: "installer" }
    - { name: "{{ iso_images.debian.dvd.name }}", url: "{{ iso_images.debian.dvd.url }}", key: "debian_dvd", category: "dvd" }
    - { name: "{{ iso_images.windows.win7.name }}", url: "{{ iso_images.windows.win7.url }}", key: "windows7", category: "installer" }
    - { name: "{{ iso_images.windows.winxp.name }}", url: "{{ iso_images.windows.winxp.url }}", key: "winxp", category: "legacy" }
  register: iso_catalog_pve_stats
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.11 [Discovery] Check ISO Catalog cached assets in assets/iso"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/assets/iso/{{ item.name }}"
  loop:
    - { name: "{{ iso_images.debian.netinst.name }}", url: "{{ iso_images.debian.netinst.url }}", key: "debian_netinst", category: "installer" }
    - { name: "{{ iso_images.debian.dvd.name }}", url: "{{ iso_images.debian.dvd.url }}", key: "debian_dvd", category: "dvd" }
    - { name: "{{ iso_images.windows.win7.name }}", url: "{{ iso_images.windows.win7.url }}", key: "windows7", category: "installer" }
    - { name: "{{ iso_images.windows.winxp.name }}", url: "{{ iso_images.windows.winxp.url }}", key: "winxp", category: "legacy" }
  register: iso_catalog_asset_stats
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.12 [Discovery] Classify ISO Catalog items status"
  ansible.builtin.set_fact:
    iso_catalog_discovery: "{{ iso_catalog_discovery | default({}) | combine({
      item.item.key: {
        'name': item.item.name,
        'category': item.item.category,
        'url': item.item.url,
        'asset_path': factory_base_dir + '/assets/iso/' + item.item.name,
        'pve_path': factory_base_dir + '/template/iso/' + item.item.name,
        'published': item.stat.exists | default(false) and (item.stat.size | default(0) > 0),
        'cached': (iso_catalog_asset_stats.results[ansible_loop.index0].stat.exists | default(false)) and (iso_catalog_asset_stats.results[ansible_loop.index0].stat.size | default(0) > 0),
        'status': (
          'PUBLISHED' if (item.stat.exists | default(false) and (item.stat.size | default(0) > 0))
          else ('CACHED' if (iso_catalog_asset_stats.results[ansible_loop.index0].stat.exists | default(false) and (iso_catalog_asset_stats.results[ansible_loop.index0].stat.size | default(0) > 0)) else 'MISSING')
        ),
        'size_bytes': item.stat.size | default(iso_catalog_asset_stats.results[ansible_loop.index0].stat.size | default(0))
      }
    }) }}"
  loop: "{{ iso_catalog_pve_stats.results }}"
  loop_control:
    extended: true
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

# ------------------------------------------------------------------------------
# 3. Driver Catalog Discovery
# ------------------------------------------------------------------------------
- name: "5.3.1.13 [Discovery] Check VirtIO Driver ISO in template/iso and assets/drivers"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/template/iso/{{ drivers.virtio.windows.name }}"
  register: driver_pve_stat
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.14 [Discovery] Check VirtIO Driver ISO in assets/drivers"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/assets/drivers/{{ drivers.virtio.windows.name }}"
  register: driver_asset_stat
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.15 [Discovery] Classify Driver Catalog status"
  ansible.builtin.set_fact:
    driver_catalog_discovery: {
      'virtio_win': {
        'name': drivers.virtio.windows.name,
        'type': drivers.virtio.windows.type | default('iso'),
        'url': drivers.virtio.windows.url,
        'asset_path': factory_base_dir + '/assets/drivers/' + drivers.virtio.windows.name,
        'pve_path': factory_base_dir + '/template/iso/' + drivers.virtio.windows.name,
        'published': driver_pve_stat.stat.exists | default(false) and (driver_pve_stat.stat.size | default(0) > 0),
        'cached': driver_asset_stat.stat.exists | default(false) and (driver_asset_stat.stat.size | default(0) > 0),
        'status': (
          'PUBLISHED' if (driver_pve_stat.stat.exists | default(false) and (driver_pve_stat.stat.size | default(0) > 0))
          else ('CACHED' if (driver_asset_stat.stat.exists | default(false) and (driver_asset_stat.stat.size | default(0) > 0)) else 'MISSING')
        ),
        'size_bytes': driver_pve_stat.stat.size | default(driver_asset_stat.stat.size | default(0))
      }
    }
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

# ------------------------------------------------------------------------------
# 4. Manual Assets Discovery
# ------------------------------------------------------------------------------
- name: "5.3.1.16 [Discovery] Detect user-provided Manual Assets in assets/manual, assets/iso, and template/iso"
  ansible.builtin.stat:
    path: "{{ factory_base_dir }}/{{ item.path }}"
  loop:
    - { name: "Windows Server ISO", filename: "windows_server_2022.iso", path: "assets/manual/windows_server_2022.iso", key: "win_server" }
    - { name: "Custom Firmware Image", filename: "custom_firmware.bin", path: "assets/manual/custom_firmware.bin", key: "firmware_oem" }
    - { name: "OEM Media ISO", filename: "oem_drivers_media.iso", path: "assets/manual/oem_drivers_media.iso", key: "oem_media" }
  register: manual_assets_stats
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.17 [Discovery] Classify Manual Assets status"
  ansible.builtin.set_fact:
    manual_assets_discovery: "{{ manual_assets_discovery | default({}) | combine({
      item.item.key: {
        'name': item.item.name,
        'filename': item.item.filename,
        'path': factory_base_dir + '/' + item.item.path,
        'status': ('PRESENT' if (item.stat.exists | default(false) and (item.stat.size | default(0) > 0)) else 'OPTIONAL_MISSING'),
        'size_bytes': item.stat.size | default(0),
        'optional': true
      }
    }) }}"
  loop: "{{ manual_assets_stats.results }}"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

- name: "5.3.1.18 [Discovery] Informational Notice for missing optional manual assets"
  ansible.builtin.debug:
    msg: "Notice: Manual asset '{{ item.value.name }}' ({{ item.value.filename }}) is missing. Skipping automatically as optional."
  loop: "{{ manual_assets_discovery | dict2items }}"
  when: item.value.status == 'OPTIONAL_MISSING'
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  tags: ['stage5', 'discovery']

# ------------------------------------------------------------------------------
# 5. Output Discovery Cache Files
# ------------------------------------------------------------------------------
- name: "5.3.1.19 [Discovery] Ensure local runtime/discovery directory exists"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../runtime/discovery"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'discovery']

- name: "5.3.1.20 [Discovery] Save Discovery Cache: cloud_images.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/discovery/cloud_images.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'discovery',
      'stage': 5,
      'step': '5.3',
      'timestamp': ansible_date_time.iso8601,
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'storage_name': factory_storage_name,
          'base_path': factory_base_dir,
          'missing_images_count': missing_cloud_images | length,
          'cloud_images': cloud_images_discovery
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.21 [Discovery] Save Discovery Cache: iso_catalog.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/discovery/iso_catalog.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'discovery',
      'stage': 5,
      'step': '5.3',
      'timestamp': ansible_date_time.iso8601,
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'iso_catalog': iso_catalog_discovery
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.22 [Discovery] Save Discovery Cache: driver_catalog.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/discovery/driver_catalog.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'discovery',
      'stage': 5,
      'step': '5.3',
      'timestamp': ansible_date_time.iso8601,
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'driver_catalog': driver_catalog_discovery
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.23 [Discovery] Save Discovery Cache: manual_assets.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/discovery/manual_assets.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'discovery',
      'stage': 5,
      'step': '5.3',
      'timestamp': ansible_date_time.iso8601,
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'manual_assets': manual_assets_discovery
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.25 [Discovery] Ensure local runtime/reports directory exists"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../runtime/reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage5', 'discovery']

- name: "5.3.1.26 [Discovery] Save Stage 5.1 Discovery Report: discovery.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/discovery.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-init'),
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'discovery',
      'status': 'DISCOVERY_READY',
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': ansible_date_time.iso8601
      },
      'dry_run': false,
      'health': {
        'state': 'healthy',
        'warnings': 0,
        'errors': 0,
        'status': 'DISCOVERY_READY',
        'builder_node': master_builder_node,
        'missing_cloud_images_count': missing_cloud_images | length
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'cloud_images': cloud_images_discovery,
          'iso_catalog': iso_catalog_discovery,
          'driver_catalog': driver_catalog_discovery,
          'manual_assets': manual_assets_discovery
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.27 [Discovery] Save Stage 5.2 Planning Report: planning.json"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/planning.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-init'),
      'producer': 'ansible_stage5_planning',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'planning',
      'status': 'PLANNING_READY',
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': ansible_date_time.iso8601
      },
      'dry_run': false,
      'health': {
        'state': 'healthy',
        'warnings': 0,
        'errors': 0,
        'status': 'PLANNING_READY',
        'missing_cloud_images': missing_cloud_images,
        'builder_node': master_builder_node
      },
      'nodes': {
        master_builder_node: {
          'builder_node': master_builder_node,
          'missing_cloud_images': missing_cloud_images
        }
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.28 [Discovery] Update Stage 5 Pipeline State (stage5.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/stage5.json"
    mode: '0644'
    content: "{{ {
      'api_version': 'v1',
      'schema_version': '1.0',
      'pipeline_version': '1.0',
      'execution_id': stage5_execution_id | default('exec-stage5-init'),
      'producer': 'ansible_stage5_discovery',
      'resource_type': 'report',
      'stage': 5,
      'current_stage': 'planning',
      'status': 'PLANNING_READY',
      'completed': ['discovery', 'planning'],
      'pending': ['asset_catalog', 'reporting'],
      'executed_at': ansible_date_time.iso8601,
      'timestamps': {
        'started_at': stage5_start_time | default(ansible_date_time.iso8601),
        'updated_at': ansible_date_time.iso8601,
        'completed_at': None
      },
      'health': {
        'state': 'healthy',
        'warnings': 0,
        'errors': 0,
        'status': 'PLANNING_READY',
        'builder_node': master_builder_node,
        'factory_storage': factory_storage_name
      }
    } | to_nice_json }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage5', 'discovery']

- name: "5.3.1.29 [Discovery] Mirror all Discovery & Planning Reports to Builder Node"
  ansible.builtin.copy:
    dest: "{{ factory_base_dir }}/runtime/reports/{{ item }}"
    src: "{{ playbook_dir }}/../runtime/reports/{{ item }}"
    mode: '0644'
  loop:
    - "discovery.json"
    - "planning.json"
    - "stage5.json"
  run_once: true
  delegate_to: "{{ master_builder_node }}"
  changed_when: false
  tags: ['stage5', 'discovery']


