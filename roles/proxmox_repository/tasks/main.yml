---
# Role: proxmox_repository
# Disables Proxmox VE enterprise repo, enables no-subscription repo, removes GUI subscription nag.

- name: Disable Proxmox VE enterprise repository
  ansible.builtin.apt_repository:
    repo: "deb https://enterprise.proxmox.com/debian/pve bookworm pve-enterprise"
    state: absent
    filename: pve-enterprise

- name: Comment out enterprise repository line if file still exists
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^deb https://enterprise.proxmox.com'
    line: '# deb https://enterprise.proxmox.com/debian/pve bookworm pve-enterprise'
    state: present
  ignore_errors: true

- name: Enable Proxmox VE no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    state: present
    filename: pve-no-subscription
    update_cache: true

- name: Remove Proxmox VE web interface subscription warning prompt
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "Ext\\.Msg\\.show\\(\\{\\s*title: gettext\\('No valid sub"
    replace: "void({ // Ext.Msg.show({ title: gettext('No valid sub"
  ignore_errors: true
  notify: Restart pveproxy
