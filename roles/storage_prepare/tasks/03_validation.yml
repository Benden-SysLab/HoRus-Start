---
# 3.3 Storage Safety Validation & Desired State Reconciliation Engine Tasks
# COMPUTES ACTION DECISIONS, SAFETY CONSTRAINTS & GENERATES MACHINE-READABLE ACTION PLAN

- name: "3.3.1 [Validation] Log storage target discovery count for node"
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} has {{ node_storage_targets | default([]) | length }} target storage drive(s) to evaluate."
  tags: ['stage3', 'validation', 'verify', 'reconcile']

- name: "3.3.2 [Validation] Safety check: Assert target storage devices are NOT System OS Disks"
  ansible.builtin.assert:
    that:
      - "item.device != '/dev/' ~ os_disk_name"
      - "item.mount_point != '/'"
      - "item.mount_point != '/boot'"
      - "item.mount_point != '/etc/pve'"
      - "item.mount_point != '/var'"
      - "item.mount_point != '/usr'"
    fail_msg: "CRITICAL SAFETY VIOLATION: Target storage device {{ item.device }} or mount {{ item.mount_point }} conflicts with System OS Disk on {{ inventory_hostname }}!"
    success_msg: "✔ Device {{ item.device }} confirmed non-system disk on {{ inventory_hostname }}."
  loop: "{{ node_storage_targets | default([]) }}"
  when:
    - node_storage_targets is defined
    - node_storage_targets | length > 0
    - item.device is defined
    - item.device != ''
    - (item.driver | default(item.type | default('dir')) | lower | trim) != 'nfs' or inventory_hostname == storage_nfs_backend_host
  tags: ['stage3', 'validation', 'verify', 'reconcile']

- name: "3.3.3 [Validation] Check physical device or by-id existence on node"
  ansible.builtin.stat:
    path: "{{ item.device }}"
  register: target_dev_stats
  loop: "{{ node_storage_targets | default([]) }}"
  when:
    - node_storage_targets is defined
    - node_storage_targets | length > 0
    - item.device is defined
    - item.device != ''
    - (item.driver | default(item.type | default('dir')) | lower | trim) != 'nfs' or inventory_hostname == storage_nfs_backend_host
  tags: ['stage3', 'validation', 'verify', 'reconcile']

- name: "3.3.4 [Reconciliation] Inspect runtime filesystem signatures via blkid"
  ansible.builtin.command: "blkid -s TYPE -s UUID -o export {{ item.device }}"
  register: target_dev_blkid
  changed_when: false
  failed_when: false
  loop: "{{ node_storage_targets | default([]) }}"
  when:
    - node_storage_targets is defined
    - node_storage_targets | length > 0
    - item.device is defined
    - item.device != ''
    - (item.driver | default(item.type | default('dir')) | lower | trim) != 'nfs' or inventory_hostname == storage_nfs_backend_host
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.5 [Reconciliation] Inspect runtime active device mount status via findmnt"
  ansible.builtin.command: "findmnt -n -o TARGET {{ item.device }}"
  register: target_dev_findmnt
  changed_when: false
  failed_when: false
  loop: "{{ node_storage_targets | default([]) }}"
  when:
    - node_storage_targets is defined
    - node_storage_targets | length > 0
    - item.device is defined
    - item.device != ''
    - (item.driver | default(item.type | default('dir')) | lower | trim) != 'nfs' or inventory_hostname == storage_nfs_backend_host
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.6 [Reconciliation] Check open file descriptors on device if mounted via fuser"
  ansible.builtin.command: "fuser -m {{ item.device }}"
  register: target_dev_fuser
  changed_when: false
  failed_when: false
  loop: "{{ node_storage_targets | default([]) }}"
  when:
    - node_storage_targets is defined
    - node_storage_targets | length > 0
    - item.device is defined
    - item.device != ''
    - (item.driver | default(item.type | default('dir')) | lower | trim) != 'nfs' or inventory_hostname == storage_nfs_backend_host
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.7 [Reconciliation] Inspect runtime Proxmox VE storage status via pvesm status"
  ansible.builtin.command: pvesm status
  register: target_dev_pvesm
  changed_when: false
  failed_when: false
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.8 [Reconciliation] Compute granular action decision flags (Reconciliation Engine)"
  ansible.builtin.set_fact:
    node_reconciled_targets: []
  when: node_storage_targets is defined and node_storage_targets | length > 0
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.8a [Reconciliation] Build action decisions per storage target"
  ansible.builtin.include_tasks: reconcile_target.yml
  loop: "{{ node_storage_targets | default([]) }}"
  loop_control:
    loop_var: reconcile_target
    index_var: reconcile_target_index
    label: "{{ reconcile_target.name | default('unnamed-storage') }}"
  when: node_storage_targets is defined and node_storage_targets | length > 0
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.9 [Reconciliation] Ensure runtime directories exist on localhost"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "runtime/plans"
    - "runtime/reports"
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.10 [Reconciliation] Generate Machine-Readable Action Plan (runtime/plans/storage_plan.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../{{ item }}"
    mode: '0644'
    content: |
      {
        "api_version": "v1",
        "schema_version": "1.0",
        "producer": "storage_prepare",
        "resource_type": "plan",
        "stage": 3,
        "step": "reconciliation_plan",
        "generated_at": "{{ ansible_date_time.iso8601 if ansible_date_time is defined else '' }}",
        "dry_run": {{ (storage_plan_only | default(false) | bool) | to_json }},
        "nodes": {
      {% for h in ansible_play_hosts %}
          "{{ h }}": {
            "node_name": "{{ h }}",
            "management_ip": "{{ hostvars[h]['ansible_host'] }}",
            "reconciled_targets_count": {{ (hostvars[h]['node_reconciled_targets'] | default([])) | length }},
            "targets": {{ (hostvars[h]['node_reconciled_targets'] | default([])) | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        }
      }
  loop:
    - "runtime/plans/storage_plan.json"
    - "runtime/reports/storage_plan.json"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.11 [Reconciliation] Display Formatted Storage Reconciliation Action Plan Report"
  ansible.builtin.debug:
    msg:
      - "=========================================================================="
      - "STORAGE RECONCILIATION ACTION PLAN — {{ inventory_hostname }}"
      - "--------------------------------------------------------------------------"
      - "Storage Name: {{ item.name }}"
      - "Target Device: {{ item.device }} (UUID: {{ item.uuid | default('N/A') }})"
      - "Current State: Mounted ({{ item.mounted }}), Registered ({{ item.registered_in_proxmox }}), FS ({{ item.current_fstype }})"
      - "Current Proxmox Type: {{ item.current_proxmox_type }} (matches desired: {{ item.proxmox_type_matches }})"
      - "Desired State: {{ item.state | upper }} (Driver: {{ item.driver }}, Shared: {{ item.shared }}, Mount: {{ item.mount_point }})"
      - "Reconciliation Decisions & Planned Execution Actions:"
      - "  - Remove Proxmox Storage (needs_pvesm_remove): {{ item.needs_pvesm_remove }}"
      - "  - Unmount Filesystem (needs_umount): {{ item.needs_umount }} (Open Handles: {{ item.has_open_file_handles }})"
      - "  - Wipe Disk on Remove (needs_wipe_on_remove): {{ item.needs_wipe_on_remove }}"
      - "  - Format Filesystem (needs_format): {{ item.needs_format }} (Safe: {{ item.safe_to_format }}, Allowed: {{ item.operator_allowed_format }})"
      - "  - Ensure Mount Directory (needs_mkdir): {{ item.needs_mkdir }}"
      - "  - Create Systemd Mount Unit (needs_systemd_mount): {{ item.needs_systemd_mount }}"
      - "  - Update /etc/fstab (needs_fstab): {{ item.needs_fstab }}"
      - "  - Mount Storage Volume (needs_mount): {{ item.needs_mount }}"
      - "  - Register Proxmox Storage (needs_pvesm_add): {{ item.needs_pvesm_add }}"
      - "  - Replace mismatched Proxmox backend (remove then add): {{ item.needs_backend_replacement }}"
      - "  - Update Proxmox Storage Scoping (needs_conversion): {{ item.needs_conversion }}"
      - "=========================================================================="
  loop: "{{ node_reconciled_targets | default([]) }}"
  when: node_reconciled_targets is defined and node_reconciled_targets | length > 0
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.12 [Action Plan Prompt] Interactive Confirmation before Provisioning Execution"
  ansible.builtin.pause:
    prompt: "STORAGE RECONCILIATION PLAN GENERATED FOR {{ inventory_hostname }}. Proceed with provisioning execution? [Y/n]:"
  register: prompt_plan_confirm
  when:
    - not (non_interactive | default(false) | bool)
    - not (storage_plan_only | default(false) | bool)
    - node_reconciled_targets is defined and node_reconciled_targets | length > 0
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.13 [Dry-Run Check] Evaluate Dry-Run / Plan-Only execution flag"
  ansible.builtin.set_fact:
    cancel_provisioning: >-
      {{
        (storage_plan_only | default(false) | bool) or
        (prompt_plan_confirm.user_input is defined and ((prompt_plan_confirm.user_input | default('y') | lower | trim) in ['n', 'no', '0', 'cancel']))
      }}
  tags: ['stage3', 'validation', 'reconcile']

- name: "3.3.14 [Validation] Log Safety & State Reconciliation Execution Decision"
  ansible.builtin.debug:
    msg: >-
      {%- if cancel_provisioning | bool -%}
        [DRY-RUN / CANCELLED] Reconciliation plan saved to runtime/reports/storage_plan.json. Provisioning execution will be SKIPPED for {{ inventory_hostname }}.
      {%- else -%}
        ✔ Stage 3.3 Storage Reconciliation Engine successfully authorized provisioning for {{ inventory_hostname }}.
      {%- endif -%}
  tags: ['stage3', 'validation', 'verify', 'reconcile']
