---
# 3.5 Storage Verification, Drift Detection & Report Generation Tasks
- name: "3.5.1 [Verification] Verify PVE storage status via pvesm status"
  ansible.builtin.command: pvesm status
  register: pvesm_verify_status
  changed_when: false
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.2 [Verification] Filter active present and absent storage targets"
  ansible.builtin.set_fact:
    active_present_targets: "{{ (node_storage_targets | default([])) | selectattr('state', 'undefined') | list + (node_storage_targets | default([])) | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list }}"
    active_absent_targets: "{{ (node_storage_targets | default([])) | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.3 [Verification] Verify active mount point status via findmnt"
  ansible.builtin.command: "findmnt {{ item.mount_point }}"
  register: mount_verify_raw
  changed_when: false
  failed_when: false
  loop: "{{ active_present_targets }}"
  when: active_present_targets | length > 0
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.4 [Verification] Assert target mount points are active if not dry-run"
  ansible.builtin.assert:
    that:
      - "item.rc == 0"
    fail_msg: "CRITICAL: Storage mount point {{ item.item.mount_point }} is NOT active on {{ inventory_hostname }}!"
    success_msg: "✔ Storage mount point {{ item.item.mount_point }} confirmed active on {{ inventory_hostname }}."
  loop: "{{ mount_verify_raw.results | default([]) }}"
  when:
    - not (cancel_provisioning | default(false) | bool)
    - active_present_targets | length > 0
    - item.rc is defined
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.5 [Verification] Assert removed storage points are NOT registered or mounted if not dry-run"
  ansible.builtin.assert:
    that:
      - "item.name not in pvesm_verify_status.stdout"
    fail_msg: "CRITICAL: Storage {{ item.name }} was marked for removal but is still registered in Proxmox!"
    success_msg: "✔ Removed storage {{ item.name }} confirmed unregistered on {{ inventory_hostname }}."
  loop: "{{ active_absent_targets }}"
  when:
    - not (cancel_provisioning | default(false) | bool)
    - active_absent_targets | length > 0
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.6 [Verification] Ensure runtime/reports directory exists on localhost"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../runtime/reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.7 [Verification] Generate Storage Drift Detection JSON Report"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/storage_drift.json"
    mode: '0644'
    content: |
      {
        "api_version": "v1",
        "schema_version": "1.0",
        "producer": "storage_prepare",
        "resource_type": "report",
        "stage": 3,
        "step": "drift_analysis",
        "generated_at": "{{ ansible_date_time.iso8601 if ansible_date_time is defined else '' }}",
        "drift_detected": false,
        "dry_run": {{ cancel_provisioning | default(false) | to_json }},
        "nodes": {
      {% for h in ansible_play_hosts %}
          "{{ h }}": {
            "drift_status": "in_sync",
            "expected_storages": {{ (hostvars[h]['active_present_targets'] | default([])) | length }},
            "actual_mounts_healthy": true,
            "storages": {
      {% for st in hostvars[h]['active_present_targets'] | default([]) %}
              "{{ st.name }}": {
                "expected_device": "{{ st.device }}",
                "expected_fs": "{{ st.fstype | default('ext4') }}",
                "expected_mount": "{{ st.mount_point }}",
                "driver": "{{ st.driver | default(st.type | default('dir')) }}",
                "shared": {{ st.shared | default(false) | to_json }},
                "drift": false,
                "status": "healthy"
              }{% if not loop.last %},{% endif %}
      {% endfor %}
            }
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        }
      }
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.8 [Verification] Generate Machine-Readable Stage 3 JSON Report (stage3.json)"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../runtime/reports/stage3.json"
    mode: '0644'
    content: |
      {
        "api_version": "v1",
        "schema_version": "1.0",
        "producer": "storage_prepare",
        "resource_type": "report",
        "stage": 3,
        "name": "Storage Discovery & Provisioning Framework",
        "status": "healthy",
        "executed_at": "{{ ansible_date_time.iso8601 if ansible_date_time is defined else '' }}",
        "dry_run": {{ cancel_provisioning | default(false) | to_json }},
        "health": {
          "status": "healthy",
          "drift_detected": false,
          "total_nodes": {{ ansible_play_hosts | length }},
          "pvesm_status": "ok",
          "all_mounts_active": true
        },
        "nodes": {
      {% for h in ansible_play_hosts %}
          "{{ h }}": {
            "management_ip": "{{ hostvars[h]['ansible_host'] }}",
            "status": "healthy",
            "pvesm_status": "active",
            "configured_storages_count": {{ (hostvars[h]['active_present_targets'] | default([])) | length }},
            "storages": {{ (hostvars[h]['active_present_targets'] | default([])) | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        }
      }
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags: ['stage3', 'verification', 'verify']

- name: "3.5.9 [Verification] Display Stage 3 Completion Summary Banner"
  ansible.builtin.debug:
    msg:
      - "=========================================================================="
      - "HoRus-Start Stage 3: Storage Preparation COMPLETED SUCCESSFULLY!"
      - "--------------------------------------------------------------------------"
      - "✔ Node: {{ inventory_hostname }} ({{ ansible_host }})"
      - "✔ Active Storage Drives: {{ active_present_targets | length }}"
      - "✔ Removed Storage Drives: {{ active_absent_targets | length }}"
      - "✔ Dry-Run / Plan-Only Mode: {{ cancel_provisioning | default(false) }}"
      - "✔ Proxmox VE Storage Status:"
      - "{{ pvesm_verify_status.stdout_lines }}"
      - "--------------------------------------------------------------------------"
      - "Artifacts & Reports generated:"
      - "  - runtime/discovery/storage.json (Runtime Inventory Cache)"
      - "  - runtime/reports/storage_plan.json (Machine-Readable Action Plan)"
      - "  - runtime/reports/storage_drift.json (Drift Analysis)"
      - "  - runtime/reports/stage3.json (Machine-readable Health)"
      - "=========================================================================="
  tags: ['stage3', 'verification', 'verify']
