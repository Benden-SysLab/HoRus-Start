# ==============================================================================
# HoRus-Start Stage 5: Image Catalog (config/image_catalog.yml)
# Single Source of Truth for Debian 13 Infrastructure, ISOs, VirtIO, & LXC
# ==============================================================================

version: "1.0"
builder_node: "horus-pmx-node03"

supported_os:
  debian13:
    name: "debian-13-genericcloud-amd64.qcow2"
    template_name: "debian13-golden-template"
    vmid: 9000
    url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    sha256: ""
    format: "qcow2"
    os_type: "debian"
    version: "13"
    min_specs:
      cpu: 2
      ram_mb: 2048
      disk_gb: 10
    cloud_init:
      user: "debian"
      package_upgrade: true
      qemu_agent: true
      serial_console: true

iso_images:
  debian:
    netinst:
      name: "debian-13.6.0-amd64-netinst.iso"
      url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.6.0-amd64-netinst.iso"
      type: "installer"
      subdirectory: "debian"
    dvd:
      name: "debian-13.6.0-amd64-DVD-1.iso"
      url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/debian-13.6.0-amd64-DVD-1.iso"
      type: "dvd"
      subdirectory: "debian"

  windows:
    win7:
      name: "en_windows_7_ultimate_with_sp1_x64_dvd_u_677332.iso"
      url: "https://archive.org/download/en_windows_7_ultimate_with_sp1_x64_dvd_u_677332_202412/en_windows_7_ultimate_with_sp1_x64_dvd_u_677332.iso"
      type: "installer"
      subdirectory: "windows"
    winxp:
      name: "en_windows_xp_professional_n_with_service_pack_3_x86_cd_vl_x14-78118.iso"
      url: "https://archive.org/download/WinXPProNSP3x86/en_windows_xp_professional_n_with_service_pack_3_x86_cd_vl_x14-78118.iso"
      type: "legacy"
      subdirectory: "windows"

drivers:
  virtio:
    windows:
      name: "virtio-win.iso"
      url: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/latest-virtio/virtio-win.iso"
      type: "iso"
      subdirectory: "virtio"

lxc_templates:
  debian13:
    os: "debian"
    version: "13"
    release: "trixie"
    pve_template_name: "debian-13-standard"
    latest: true
