---
# HoRus-Start Stage 0: Connectivity Variables
cluster_name: "HoRus-SysLab"
ansible_user: "root"

# SSH Identity Configuration. The key is external to the repository.
ssh_key_dir: "{{ lookup('env', 'HORUS_SSH_KEY_DIR') | default((lookup('env', 'USERPROFILE') if lookup('env', 'USERPROFILE') else lookup('env', 'HOME')) ~ '/.ssh/horus/horus-pmx-node', true) }}"
ssh_key_filename: "{{ lookup('env', 'HORUS_SSH_KEY_NAME') | default('horus-pmx-cluster', true) }}"
ssh_private_key_path: "{{ ssh_key_dir }}/{{ ssh_key_filename }}"
ssh_public_key_path: "{{ ssh_key_dir }}/{{ ssh_key_filename }}.pub"
ansible_ssh_private_key_file: "{{ ssh_private_key_path }}"
ssh_key_type: "ed25519"
ssh_key_comment: "horus-pmx-cluster@horus"

# Connectivity & Discovery parameters
ssh_port: 22
ping_count: 2
discovery_timeout_seconds: 5

# Reports output
